<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Veegame — Legacy history</title><style>body{margin:0;background:#191919;color:#eee;font:15px/1.5 system-ui,sans-serif}main{max-width:680px;margin:auto;padding:24px 16px}a{color:#e2c889}h1{font-size:24px}p{color:#bbb}.card{border:1px solid #494238;border-radius:10px;padding:14px;margin:12px 0}.muted{color:#b8b1a5;font-size:12px;overflow-wrap:anywhere}button{padding:9px 18px;margin:8px 6px 8px 0;background:#d4b777;color:#191919;border:0;border-radius:6px}button:disabled{opacity:.4}#status{color:#e2c889}</style><main><a href="/#/saasLottery/WinGo?gameCode=WinGo_1M">← Back to WinGo</a><h1>Legacy history</h1><p>Read-only records preserved during migration. No stake or payout is replayed. “Recorded time” is the original stored value; old settlement code could update it, so it is not presented as a verified bet-placement time.</p><div id="status" role="status">Loading…</div><section id="records"></section><button id="prev">Previous</button><button id="next">Next</button></main><script>
let page=1,total=0;const status=document.querySelector('#status'),records=document.querySelector('#records');
function token(){try{const v=JSON.parse(localStorage.getItem('ar_token')||'null');return typeof v==='string'?v:v?.value||''}catch{return ''}}
function line(parent,text,cls){const el=document.createElement('div');el.textContent=text;if(cls)el.className=cls;parent.append(el)}
async function load(){records.replaceChildren();status.textContent='Loading…';try{const t=token();if(!t)throw Error('Please open WinGo while signed in, then reopen Legacy history.');const r=await fetch('/api/Lottery/GetLegacyRecordPage?pageNo='+page,{headers:{Authorization:'Bearer '+t},cache:'no-store'});const b=await r.json();if(!r.ok||b.code!==0)throw Error('Session expired or archive unavailable. Please sign in again.');total=b.data.totalPage;status.textContent=b.data.totalCount?'Page '+page+' of '+total+' · '+b.data.totalCount+' archived records':'No archived records yet. Existing legacy database records are not deleted by this integration.';for(const row of b.data.list){const card=document.createElement('article');card.className='card';line(card,'Issue '+row.issueNumber);line(card,'Selection '+row.selection+' · Original stake ₹'+row.stake);line(card,'Stored result: '+(row.result??'Pending')+' · Legacy status: '+row.legacyStatus);line(card,'Recorded time: '+(row.recordedTime||'Not available'),'muted');line(card,row.sourceTable+' / '+row.sourceId,'muted');records.append(card)}}catch(e){status.textContent=e.message}document.querySelector('#prev').disabled=page<=1;document.querySelector('#next').disabled=page>=total}
document.querySelector('#prev').onclick=()=>{if(page>1){page--;load()}};document.querySelector('#next').onclick=()=>{if(page<total){page++;load()}};load();
</script></html>
